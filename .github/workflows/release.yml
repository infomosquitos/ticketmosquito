name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Run unit tests
        run: go test -race ./...

  build:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: darwin
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: linux
            goarch: amd64
          - goos: windows
            goarch: amd64
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          VERSION: ${{ github.ref_name }}
        run: |
          name="ticketmosquito-${GOOS}-${GOARCH}"
          if [ "$GOOS" = "windows" ]; then
            name="${name}.exe"
          fi
          mkdir -p dist
          CGO_ENABLED=0 go build \
            -ldflags "-s -w -X github.com/infomosquitos/ticketmosquito/internal/cliapp.Version=${VERSION}" \
            -o "dist/${name}" \
            ./cmd/ticketmosquito

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ticketmosquito-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/ticketmosquito-*

  build-extensions:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            chrome-extension/package-lock.json
            firefox-extension/package-lock.json

      - name: Build extension packages
        timeout-minutes: 30
        env:
          VERSION: ${{ github.ref_name }}
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
          REQUIRE_FIREFOX_XPI: "1"
        run: |
          chmod +x scripts/build-extension-zips.sh
          ./scripts/build-extension-zips.sh "$VERSION" dist

      - name: Upload extension artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ticketmosquito-extensions
          path: |
            dist/ticketmosquito-firefox-*.xpi
            dist/ticketmosquito-chrome-*.zip

  release:
    needs: [build, build-extensions]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Generate checksums
        working-directory: dist
        run: |
          sha256sum ticketmosquito-* > SHA256SUMS || shasum -a 256 ticketmosquito-* > SHA256SUMS

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/ticketmosquito-*
            dist/SHA256SUMS
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  homebrew:
    needs: release
    # Pre-release tags (v1.2.3-rc1) do not update the tap.
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Download checksums
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --pattern SHA256SUMS --dir dist

      - uses: actions/checkout@v7
        with:
          repository: infomosquitos/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-tap

      - name: Update cask
        run: |
          mkdir -p homebrew-tap/Casks
          chmod +x scripts/render-homebrew-cask.sh
          ./scripts/render-homebrew-cask.sh "$GITHUB_REF_NAME" dist/SHA256SUMS > homebrew-tap/Casks/ticketmosquito.rb
          cd homebrew-tap
          git add Casks/ticketmosquito.rb
          if git diff --cached --quiet; then
            echo "Cask already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "ticketmosquito ${GITHUB_REF_NAME#v}"
          git push
