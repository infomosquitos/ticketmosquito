<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ticket Mosquito</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup">
    <header class="header">
      <div class="logo">
        <img class="icon" src="assets/icon.svg" width="24" height="24" alt="">
        <span class="title">Ticket Mosquito</span>
      </div>
      <span id="session-dot" class="status-dot checking" title="Session"></span>
    </header>

    <div id="backend-banner" class="banner hidden">
      Backend unreachable at <span id="backend-host"></span>
    </div>

    <section class="block">
      <p class="host" id="page-host">—</p>
      <p class="hint" id="page-hint">Open a Jira tab to capture a session.</p>
    </section>

    <section class="block actions">
      <button type="button" id="btn-capture" class="btn primary" disabled>Capture session</button>
      <button type="button" id="btn-validate" class="btn" disabled>Validate</button>
      <button type="button" id="btn-delete" class="btn danger" disabled>Clear session</button>
    </section>

    <p id="status-msg" class="status-msg"></p>

    <section class="block settings">
      <label for="backend-url">Backend URL</label>
      <div class="row">
        <input type="text" id="backend-url" placeholder="http://127.0.0.1:11043">
        <button type="button" id="btn-save-url" class="btn small">Save</button>
      </div>
    </section>
  </div>
  <script src="popup.js"></script>
</body>
</html>
